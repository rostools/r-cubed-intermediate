name: Build website

on:
  push:
    branches:
      - main

# Limit token permissions for security
permissions: read-all

jobs:
  build-website:
    runs-on: ubuntu-latest
    # Stop builds from running more than one at a time, to save resources and also
    # to limit conflicts when uploading to the hosting provider.
    concurrency:
      group: build-website-group
      cancel-in-progress: true

    steps:
      # This is a useful security step to check for unexpected outbound calls from the runner,
      # which could indicate a compromised token or runner.
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Spell check repo
        uses: crate-ci/typos@4d9c206a77c041268485162b8e2579ad7a5cb9a3 # v1.50.0

      - name: Setup R
        uses: r-lib/actions/setup-r@465b7d8e732ca3921382b1674c59bada9cbf3399
        with:
          use-public-rspm: true

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@465b7d8e732ca3921382b1674c59bada9cbf3399

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          # Install a specific version of uv.
          version: "0.11.4"

      # Need to download the dataset before rendering and it's too big to store in the repo.
      # So it has to be downloaded from somewhere else. I put it in my Google Drive and made the
      # file public. The gdown tool makes it easy to download from Google Drive, but it isn't
      # often updated and hasn't bee active for a while. But for now, and for this purpose,
      # it's fine.
      - name: Download dataset
        run: |
          cd data-raw
          uvx gdown 'https://drive.google.com/uc?id=18-pm89Smtu5h7vzb5nyODTrKO-h1b9Xe'

      - name: Publish to Netlify (and render)
        uses: quarto-dev/quarto-actions/publish@8a96df13519ee81fd526f2dfca5962811136661b # v2.2.0
        with:
          target: netlify
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
